[package]
name = "craft"
version = "1.0.0-beta.12"
edition = "2024"
license = "MIT"

[[bin]]
name = "crafty"
path = "src/main.rs"

# superlighttui's lib target is named `slt` (every use is `slt::…`), so
# cargo-machete cannot see the dependency is used.
[package.metadata.cargo-machete]
ignored = ["superlighttui"]

[dependencies]
agent-client-protocol.workspace = true
aho-corasick.workspace = true
animist.workspace = true
arboard.workspace = true
arc-swap.workspace = true
argosy.workspace = true
async-trait.workspace = true
barkml.workspace = true
base64.workspace = true
bs58.workspace = true
clap.workspace = true
clap_complete.workspace = true
dirs.workspace = true
etcetera.workspace = true
flume = "0.12"
futures.workspace = true
htmd.workspace = true
http.workspace = true
ignore.workspace = true
image.workspace = true
indexmap.workspace = true
jiff.workspace = true
jsonrepair.workspace = true
libc.workspace = true
minijinja.workspace = true
nucleo-matcher.workspace = true
regex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
similar.workspace = true
snafu.workspace = true
syntect.workspace = true
superlighttui.workspace = true
tempfile.workspace = true
tokio = {
  workspace = true,
  features = ["fs", "macros", "net", "process", "rt"]
}
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
two-face.workspace = true
unicode-normalization.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
animist = { workspace = true, features = ["testing"] }
fastrand = "2"
test-case = "3"
