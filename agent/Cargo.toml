[package]
name = "craft"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-client-protocol.workspace = true
aho-corasick.workspace = true
base64.workspace = true
bs58 = "0.5"
clap.workspace = true
clap_complete = "4"
crossterm.workspace = true
dirs.workspace = true
etcetera.workspace = true
futures.workspace = true
http = "1"
htmd = "0.5"
image.workspace = true
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
jiff = "0.2"
ignore.workspace = true
libc = "0.2"
ratatui.workspace = true
regex.workspace = true
reqwest.workspace = true
rig-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { version = "3", features = ["inline", "unicode"] }
snafu.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt"] }
toml.workspace = true
toml_edit.workspace = true
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
url.workspace = true
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
rig-core = { workspace = true, features = ["test-utils"] }
fastrand = "2"
test-case = "3"
