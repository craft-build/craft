# Copy to ~/.config/craft/agent.toml and set credentials in your environment.
# Provider table names are your aliases, not fixed Rig provider names.

[agent]
# Extra instructions appended to the assembled system prompt's instructions
# slot. Empty keeps the built-in defaults.
preamble = ""
# Optional generation settings; omitted by default for provider/model defaults.
# temperature = 0.2
# max_tokens = 8192

# Compaction stages, ascending by context fill ratio. Omitted entirely, this
# defaults to vcc at 0.6 then llm at 0.8. "vcc" is a deterministic no-LLM
# summary; "llm" runs a one-shot summarization call. A stage whose last run
# saved under 10% of the context is skipped until another stage compacts
# effectively.
[[compaction]]
kind = "vcc"
context = "0.6"

[[compaction]]
kind = "llm"
context = "0.8"

[providers.openai]
kind = "openai"
api_key_env = "OPENAI_API_KEY"

[providers.openai.models."gpt-5.2"]
name = "GPT-5.2"
# These are catalog metadata overrides, not generation request parameters.
context_length = 400000
max_output_tokens = 32768

# OpenAI Chat Completions protocol, rather than OpenAI's Responses API.
[providers.local]
kind = "openai-compatible"
base_url = "http://localhost:8080/v1"
api_key_env = "LOCAL_LLM_API_KEY"
discover_models = false

[providers.local.models."my-coding-model"]
context_length = 32768

# The native Anthropic client also supports compatible endpoints.
[providers.company]
kind = "anthropic"
base_url = "https://llm.example.com"
api_key_env = "COMPANY_LLM_API_KEY"
discover_models = false

[providers.company.models."company-coder"]

# Local Ollama needs no credential unless your server requires one.
[providers.ollama]
kind = "ollama"
