[workspace]
members = ["craft-acp"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
dirs = "6"
rig = "0.42.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
toml = "1"
url = "2"

[package]
name = "craft"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
tokio.workspace = true
once_cell = "1"
agent-client-protocol = "2.1.0"
serde.workspace = true
serde_json = "1"
shell-words = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
pulldown-cmark = "0.13"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[[bin]]
name = "craft"
path = "src/main.rs"
