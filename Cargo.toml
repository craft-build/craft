[workspace]
members = ["agent"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "2.1.0"
snafu = "0.9"
dirs = "6"
futures = "0.3"
ignore = "0.4"
regex = "1"
rig = "0.42.0"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
toml = "1"
url = "2"

[package]
name = "CraftCode"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
tokio.workspace = true
once_cell = "1"
agent-client-protocol = "2.1.0"
serde.workspace = true
serde_json.workspace = true
shell-words = "1"
uuid = { version = "1", features = ["v4"] }
similar = "2"
pulldown-cmark = "0.13"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

[[bin]]
name = "craft_code"
path = "src/main.rs"
