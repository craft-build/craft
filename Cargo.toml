[package]
name = "CraftCode"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = ["agent"]

[workspace.dependencies]
aho-corasick = "1"
agent-client-protocol = "2.1.0"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
etcetera = "0.11"
futures = "0.3"
ignore = "0.4"
image = "0.25"
ratatui = "0.30"
regex = "1"
reqwest = "0.13"
rig-core = "0.42"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
url = "2"

[[bin]]
name = "craft_code"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
gpui = "0.2.2"
once_cell = "1"
pulldown-cmark = "0.13"
serde.workspace = true
serde_json.workspace = true
shell-words = "1"
similar = "3"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
