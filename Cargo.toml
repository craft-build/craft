[package]
name = "craft"
version.workspace = true
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>", "Jarrett Tierney <akarifur@pm.me>"]
description = "AI coding agent. Native Rust TUI. Immediate startup, 60 FPS, low memory."
license = "MIT"
repository = "https://github.com/craft-build/craft"
readme = "README.md"
keywords = ["ai", "agent", "cli", "tui", "coding"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.90"

[[bin]]
name = "craft"
path = "src/main.rs"

[dependencies]
craft-ui = { workspace = true }
craft-agent = { workspace = true }
craft-acp = { workspace = true }
craft-config = { workspace = true }
craft-providers = { workspace = true, features = ["bedrock"] }
craft-storage = { workspace = true }
craft-lua = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
strum = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
flume = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
pin-project-lite = { workspace = true }
rustix = { workspace = true }
open = { workspace = true }
jiff = { workspace = true }
get-size2 = "=0.10.1"

[dev-dependencies]
test-case = { workspace = true }

[workspace]
members = [
  "craft-acp",
  "craft-agent",
  "craft-config",
  "craft-docgen",
  "craft-highlight",
  "craft-interpreter",
  "craft-lua",
  "craft-markdown",
  "craft-pack",
  "craft-providers",
  "craft-repomap",
  "craft-sandbox",
  "craft-storage",
  "craft-tool-macro",
  "craft-config-macro",
  "craft-ui",
  "craft-desktop",
]
resolver = "3"

[workspace.package]
version = "0.14.0"
edition = "2024"
authors = ["Tony Solomonik <tony.solomonik@gmail.com>", "Jarrett Tierney <akarifur@pm.me>"]
license = "MIT"
repository = "https://github.com/craft-build/craft"
rust-version = "1.90"

[workspace.dependencies]
craft-acp = { path = "craft-acp" }
craft-agent = { path = "craft-agent" }
craft-config = { path = "craft-config" }
craft-interpreter = { path = "craft-interpreter" }
craft-providers = { path = "craft-providers" }
craft-storage = { path = "craft-storage" }
craft-ui = { path = "craft-ui" }
craft-lua = { path = "craft-lua" }
craft-tool-macro = { path = "craft-tool-macro" }
craft-config-macro = { path = "craft-config-macro" }
craft-highlight = { path = "craft-highlight" }
craft-markdown = { path = "craft-markdown" }
craft-pack = { path = "craft-pack" }
craft-repomap = { path = "craft-repomap" }
craft-sandbox = { path = "craft-sandbox" }
dioxus = "0.7"
rfd = "0.15"
which = "8"
playwright-rs = { version = "0.15", default-features = false, features = ["macros", "aws-lc", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive", "rc"] }
semver = "1"
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", default-features = false, features = ["v4", "v7", "std"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
crossterm = { version = "0.29", features = ["osc52"] }
color-eyre = { version = "0.6", default-features = false, features = ["track-caller"] }
termini = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
async-trait = "0.1"
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", default-features = false }
base64 = "0.23"
url = "2"
getrandom = "0.4"
fastrand = "2"
filetime = "0.2"
test-case = "3"
ignore = "0.4"
memchr = "2"
strum = { version = "0.28", features = ["derive"] }
htmd = "0.5"
tempfile = "3"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
unicode-normalization = "0.1"
similar = { version = "3", features = ["inline", "unicode"] }
mermaid-rs-renderer = { version = "0.3", default-features = false, features = ["png"] }
usvg = "0.48"
resvg = "0.48"
tiny-skia = "0.12"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system"] }
keyring = "4"
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
flume = { version = "0.12", default-features = false, features = ["async", "select"] }
fs4 = "1"
smol = "2"
humantime = "2"
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
toml = "1"
toml_edit = "0.25"
arc-swap = "1"
bitflags = "2"
event-listener = "5"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
pin-project-lite = "0.2"
rustix = { version = "1", default-features = false, features = ["process"] }
nucleo = "0.5"
nucleo-matcher = "0.3"
open = "5"
criterion = { version = "0.8", features = ["html_reports"] }
etcetera = "0.11"
dotenvy = "0.15"
tree-sitter = "0.26"
include_dir = "0.7"
mlua = { version = "0.12", features = ["luau", "luau-jit", "async", "send", "serde", "macros"] }
minijinja = "2"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-gleam = "1.0"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-sequel = "0.3"
tree-sitter-starlark = "1.3"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-css = "0.25.0"
tree-sitter-fish = "3.6.0"
tree-sitter-gdscript = "6.1.0"
tree-sitter-gdshader = "0.4.0"
tree-sitter-godot-resource = "0.7.0"
tree-sitter-objc = "3.0.2"
tree-sitter-perl = "1.1.2"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-zsh = "0.63.4"
tree-sitter-yaml = "0.7.2"
tree-sitter-containerfile = "0.9.2"
tree-sitter-hcl = "1.1"
tree-sitter-json = "0.24"
tree-sitter-make = "1.1"
ast-grep-core = { version = "0.45", default-features = false }
ast-grep-language = { version = "0.45", default-features = false }
monty = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty" }
monty-types = { git = "https://github.com/pydantic/monty.git", tag = "v0.0.21", package = "monty-types" }
notify = { version = "9.0.0-rc.4", default-features = false, features = ["flume", "macos_fsevent"] }
serde_yaml = { package = "yaml_serde", version = "0.10" }
once_cell = "1"
shell-words = "1"
fastembed = { version = "5", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
magika = "1"
agent-client-protocol-schema = { version = "1.6", features = ["unstable_elicitation"] }
compact_str = "0.9.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
reqwest = { version = "0.13", default-features = false, features = [
  "charset", "http2", "stream", "rustls"
] }
futures = "0.3"

inventory = "0.3"
wait-timeout = "0.2"
aho-corasick = "1"
time = ">=0.3, <0.3.48"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-bedrock = { version = "1", features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-bedrockruntime = { version = "1", features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1"
aws-smithy-runtime-api = "1"

[profile.bench]
debug = true

# crossterm 0.29.0 has no VT input on Windows, so bracketed paste never decodes and a
# multiline paste submits at the first newline (#336). Pinned to the head of
# crossterm-rs/crossterm#1030, which lives in refs/pull/1030/head on the upstream repo.
# Remove once the PR ships in a crossterm release.
[patch.crates-io]
crossterm = { git = "https://github.com/crossterm-rs/crossterm", rev = "3ca54292d2b1f1c58e200a06122ddaf5dd6b5c77" }
