[package]
name = "CraftCode"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]
resolver = "3"
members = ["agent"]

[workspace.dependencies]
agent-client-protocol = "2.2"
aho-corasick = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
arc-swap = "1"
argosy = "0.6"
async-trait = "0.1"
barkml = "0.10"
base64 = "0.23"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
crossterm = "0.29"
dirs = "7"
etcetera = "0.11"
futures = "0.3"
htmd = "0.5"
http = "1"
ignore = "0.4"
image = "0.25"
indexmap = "2"
jiff = "0.2"
jsonrepair = { version = "0.1", default-features = false, features = ["serde"] }
libc = "0.2"
minijinja = "2"
nucleo-matcher = "0.3"
ratatui = "0.30"
ratatui-image = {
  version = "11",
  default-features = false,
  features = ["image-defaults", "crossterm"]
}
regex = "1"
reqwest = "0.13"
rig-bedrock = "0.42"
rig-core = "0.42"
rmcp = {
  version = "3.5",
  default-features = false,
  features = [
    "auth",
    "client",
    "reqwest",
    "transport-child-process",
    "transport-streamable-http-client-reqwest"
  ]
}
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.11"
similar = { version = "3", features = ["inline", "unicode"] }
snafu = "0.9"
syntect = {
  version = "5",
  default-features = false,
  features = ["default-fancy"]
}
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
two-face = {
  version = "0.5",
  default-features = false,
  features = ["syntect-default-fancy"]
}
unicode-normalization = "0.1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[[bin]]
name = "craft_code"
path = "src/main.rs"

[dependencies]
agent-client-protocol.workspace = true
gpui = "0.2.2"
once_cell = "1"
pulldown-cmark = "0.13"
serde.workspace = true
serde_json.workspace = true
shell-words = "1"
similar.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
