name: Release

on:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  PLAYWRIGHT_DRIVER_VERSION: "1.60.0"
  PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: craft-x86_64-unknown-linux-musl
            use_cross: "true"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            artifact: craft-aarch64-unknown-linux-musl
            use_cross: "true"
          - target: aarch64-apple-darwin
            runner: macos-latest
            artifact: craft-aarch64-apple-darwin
            use_cross: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright driver
        run: npm install -g playwright@1.60.0

      - name: Install cross
        if: matrix.use_cross == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        if: matrix.use_cross == 'true'
        run: cross build --release --all-features --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.use_cross == 'false'
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/craft dist/
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz craft

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.tar.gz
